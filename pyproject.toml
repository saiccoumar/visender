[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bliser"
version = "0.1.0"
description = "Snapshot a live viser scene and rebuild it in Blender for high-quality rendering."
requires-python = ">=3.9"
dependencies = ["numpy"]

# viser is needed only for the export half, bpy only for the import half; the
# two never run in the same interpreter, so neither is a hard dependency.
[project.optional-dependencies]
export = ["viser>=1.0"]
# pyyaml is needed only by the solver-side config/CLI wrapper (the ``bliser``
# entry point). It must never become a base dependency: Blender's bundled Python
# has no yaml, and the import half must run there. Install as
# ``bliser[cli]``; ``bliser`` says so itself if yaml is missing.
cli = ["pyyaml>=6.0"]

[project.scripts]
bliser = "bliser.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So a bare ``pytest`` works from the repo root without installing the package.
pythonpath = ["."]
markers = [
    "slow: needs a real Blender binary (skipped when none is found)",
]

[tool.setuptools]
packages = ["bliser"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "yourdfpy>=0.0.60",
]
