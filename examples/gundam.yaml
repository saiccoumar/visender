# Render config for examples/gundam.py.
#
#   visender render examples/gundam.yaml --profile draft
#   visender render examples/gundam.yaml --profile final
#
# Every path here resolves relative to this file, not your shell's CWD.

bundle: bundle_gundam                # whatever examples/gundam.py last exported;
                                  # a timestamped dir like out/gundam_142530
                                  # works too — point `bundle:` at it.
output: out/gundam_{profile}.png

profiles:
  draft: {engine: EEVEE,  samples: 64,   resolution: [1280, 720]}
  final: {engine: CYCLES, samples: 4096, resolution: [7680 , 4320], gpu: true}

# `hdri:` resolves relative to this file, and it wins over `studio:` — the
# studio gradient is only used when no HDRI is given. Set `backdrop.enabled`
# back to true to hide the environment behind a flat wall while still lighting
# the scene with it.
world:    {studio: true, strength: 0.9}
backdrop: {enabled: true, color: [255, 255, 255]}

camera:
  auto: true         # frames the scene when you export with no browser attached;
                     # ignored once a real browser camera is in the bundle
  # Keep the browser's low hero angle — eye ~3 m up, tilted ~20 degrees into an
  # 8.9 m look-at — so the robot towers and the HDRI's skyline leans back with
  # the tilt. The only problem with the original was distance: at dolly 0.75 the
  # feet fell 40% of a frame-height below the bottom edge. Positive elevation
  # here *lowers* the eye (it is measured from the camera toward the look-at),
  # so keep it small; anything past ~6 combined with a dolly puts the camera
  # underground.
  # An HDRI sits at infinity, so the skyline's *angular* size never changes —
  # the only way to dwarf it is to make the robot subtend more of the frame.
  # el 14 drops the eye to 1.4 m, the height the EXR was shot from, so the
  # buildings read exactly as a person on the Bund sees them while the robot,
  # 15 m away, fills ~90% of the frame and leans over the camera.
  orbit: [0, 14]
  dolly: 1.0         # 11 m -> 15 m: as close as 18.3 m of robot fits at 75 deg
  fit: keep_vertical # keeps the browser's full 75-degree vertical FOV — the one
                     # that matters for an 18 m subject in a 16:9 frame

lighting:
  # The scene's own key/fill are the ones you dragged in the browser. Knock them
  # back and add a camera-relative key so the framing drives the light, not the
  # world axes.
  dim_authored: 0.35
  key: {az: -40, el: 35, energy: 4.0, angle: 12.0}

# The URDF's node paths are deep and the link names are generated
# (`/robot/visual/rx78_Null_018_link/...`), so name them once here and use
# `{alias}` in the rules below. `visender list-nodes <bundle>` prints the exact
# paths.
aliases:
  body: /robot/visual
  head: /robot/visual/rx78_Null_018_link/rx78_Null_017_link/rx78_Null_016_link/rx78_Null_015_link/rx78_Null_014_link

materials:
  library:
    rx78_gold: {base_color: [125, 125, 125],
      metallic: 1.0,
      roughness: 0.18}
    rx78_dark:  {base_color: [25, 25, 25],    metallic: 1.0, roughness: 0.0}
  rules:
    - node: "{body}/*"           # trailing /* matches the whole subtree
      use: rx78_gold
    - node: "{head}/*"           # later rules win — the head goes dark
      use: rx78_gold

